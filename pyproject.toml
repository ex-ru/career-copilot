[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "0.1.0"
description = "Autonomous AI Career Profiling, Candidate Interviewer & Tailored CV Generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Career Copilot Contributors"}
]
keywords = ["cv", "resume", "career", "ai", "llm", "interview", "job-search", "docx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7.0",
    "openai>=1.12.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0"
]

[project.scripts]
career-copilot = "run:main"
